# DLY AEOS CI — pipeline gates G1 (static) and G2/G3 (controlled/product tests) from master §31.
# PR builds get no secrets; actions are pinned to full commit SHAs (supply-chain policy).
# This workflow is a protected path: workers may only propose changes to it (§09, AGENTS.md).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: G1 static — ruff
        run: python -m ruff check backend tests
      - name: G1 static — secret scan
        run: python scripts/secret_scan.py
      - name: G2 controlled tests
        run: python -m pytest -q -m "not integration and not network"

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: G1 static — typecheck
        run: npx tsc -b --noEmit
      - name: G3 product tests — unit/component
        run: npm test
      - name: Build
        run: npm run build
