# DLY AEOS CI — pipeline gates G1 (static) and G2/G3 (controlled/product tests) from master §31.
# PR builds get no secrets; actions are pinned to full commit SHAs (supply-chain policy).
# This workflow is a protected path: workers may only propose changes to it (§09, AGENTS.md).
#
# Gate mapping is explicit: every job name carries its gates in brackets ([G1,G2], [G3]) or [NO-GATE]
# for report-only jobs; aeos.delivery.provider.classify_check reads the tag (ADR-0095).
#
# Minutes budget (private repo): macOS runners bill 10x and Windows 2x. Pull requests therefore run
# the full suite on Linux and Windows plus a cross-platform smoke subset on macOS; every push to main
# runs the full suite on all three operating systems.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend [G1,G2] (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-latest","windows-latest","macos-latest"]') || fromJSON('["ubuntu-latest","windows-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install (universal lockfile, ADR-0093)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip check
      - name: G1 static — ruff
        run: python -m ruff check backend tests scripts
      - name: G1 static — mypy (ratcheted baseline in pyproject.toml)
        if: runner.os == 'Linux'
        run: python -m mypy
      - name: G1 static — secret + PII scan (blueprints, contracts, docs)
        run: python scripts/secret_scan.py
      - name: G2 controlled tests
        run: python -m pytest -q -m "not integration and not network"
      - name: G2 verifier runs the trusted suite for real (git only)
        if: runner.os == 'Linux'
        run: python -m pytest -q -m integration tests/integration/test_verification_real_suite.py

  backend-macos-smoke:
    name: backend [G2] (macos-latest, smoke)
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install (universal lockfile, ADR-0093)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip check
      - name: G2 platform-sensitive subset (paths, processes, keyring, sandbox, doctor, migrations, auth)
        run: >-
          python -m pytest -q -m "not integration and not network"
          tests/unit/test_core.py tests/unit/test_identity.py tests/unit/test_migrations.py
          tests/unit/test_doctor_checks.py tests/unit/test_doctor_cli.py tests/unit/test_doctor_seams.py
          tests/unit/test_worker_runtime_processes.py tests/unit/test_worker_runtime_workspace.py
          tests/unit/test_worker_runtime_containment.py tests/unit/test_secrets_selection.py
          tests/unit/test_claude_bridge_run.py tests/unit/test_operations_backup.py tests/unit/test_operations_release.py
          tests/unit/test_core_runtime_guards.py tests/acceptance/test_auth_boundary.py

  frontend:
    name: frontend [G1,G3]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: G1 static — typecheck
        run: npx tsc -b --noEmit
      - name: G3 product tests — unit/component
        run: npm test
      - name: Build
        run: npm run build

  browser-e2e:
    name: browser e2e + a11y smoke [G3]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m playwright install --with-deps chromium
      - name: Build the Control Center
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: G3 real-browser smoke (every nav route, 390px overflow, dark-mode contrast, labels)
        run: python -m pytest -q -m integration tests/e2e/test_ui_smoke.py
      # Baseline numbers only (REPORT_ONLY): no latency objective is decided (§33); the test fails only on a
      # pathological sanity ceiling, never on the numbers themselves.
      - name: G3 performance baseline (report-only p50/p95 of key read endpoints)
        # shell: bash = bash -eo pipefail: a failing command before `| tee` fails the step instead of being masked
        shell: bash
        env:
          DLY_AEOS_PERF_REPORT: perf-baseline.json
        run: |
          python -m pytest -q tests/unit/test_perf_baseline.py
          python -c "import json; d = json.load(open('perf-baseline.json')); [print(k, v) for k, v in d['endpoints'].items()]" | tee -a "$GITHUB_STEP_SUMMARY"

  bootstrap:
    name: bootstrap [G2] (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Bootstrap (Linux)
        if: runner.os != 'Windows'
        env:
          AEOS_DATA_DIR: ${{ runner.temp }}/aeos-bootstrap-data
        run: ./scripts/bootstrap.sh --no-doctor
      - name: Bootstrap (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          AEOS_DATA_DIR: ${{ runner.temp }}/aeos-bootstrap-data
        run: .\scripts\bootstrap.ps1 -NoDoctor
      - name: Database at head, UI built, nothing written to the source tree
        shell: bash
        env:
          AEOS_DATA_DIR: ${{ runner.temp }}/aeos-bootstrap-data
        run: |
          test -f "$AEOS_DATA_DIR/aeos.sqlite3"
          test -f frontend/dist/index.html
          if [ "$RUNNER_OS" = "Windows" ]; then PY=.venv/Scripts/python; else PY=.venv/bin/python; fi
          "$PY" -c "from aeos.core.migrate import migration_status as m; s = m(); print(s); assert s['current'] == s['head'], s"
          git status --porcelain
          test -z "$(git status --porcelain)"
      - name: Negative case — bootstrap must fail when the database step fails (invalid data dir)
        shell: bash
        env:
          AEOS_DATA_DIR: relative-data-dir
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            if pwsh -File scripts/bootstrap.ps1 -NoDoctor -SkipFrontend -SkipBackup; then echo "bootstrap did not fail"; exit 1; fi
          else
            if ./scripts/bootstrap.sh --no-doctor --skip-frontend --skip-backup; then echo "bootstrap did not fail"; exit 1; fi
          fi
          test ! -e relative-data-dir

  supply-chain:
    name: supply-chain report [NO-GATE] (SBOM, licences, vulnerabilities, SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      # Reports go to the job log and the step summary (no extra third-party action). Results are data for
      # the owner, never a pass claim: this job is [NO-GATE] until thresholds/allow-lists are decided in
      # policy/supply-chain.yaml (owner decision; status UNDECIDED = REPORT_ONLY).
      # Every step runs under `shell: bash` (bash --noprofile --norc -eo pipefail): a crashed tool before
      # `| tee` fails its step instead of looking like success. The scanner steps stay continue-on-error (a
      # finding or a crash is visible as a failed step, not a failed job); the policy evaluation below
      # treats a missing/unreadable report as such - never as "no findings".
      - name: SBOM (CycloneDX, offline, from the lockfiles)
        shell: bash
        run: |
          python scripts/supply_chain.py sbom -o sbom.cdx.json
          python -c "import json; d = json.load(open('sbom.cdx.json')); print('SBOM components:', len(d['components']))" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Licence report (REPORT_ONLY until the owner decides an allow-list)
        shell: bash
        run: |
          python scripts/supply_chain.py licenses --policy policy/supply-chain.yaml -o licenses.json
          python -c "import json; d = json.load(open('licenses.json')); print('Licences:', d['count'], 'packages,', len(d['unknown']), 'UNKNOWN:', d['unknown'], 'status:', d['status'])" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Python dependency vulnerabilities (report-only, NOT-PROVEN until thresholds are decided)
        continue-on-error: true
        shell: bash
        run: |
          python -m pip install "pip-audit==2.7.3"
          python -m pip_audit -r requirements.lock --no-deps --disable-pip -f json -o pip-audit.json
      - name: npm dependency vulnerabilities (report-only)
        continue-on-error: true
        shell: bash
        working-directory: frontend
        run: npm audit --omit=dev --json > npm-audit.json
      - name: SAST — bandit (report-only)
        continue-on-error: true
        shell: bash
        run: |
          python -m pip install "bandit==1.7.10"
          python -m bandit -q -r backend/aeos -f json -o bandit.json
      # Severity filtering is the owner's threshold (policy file), never a tool flag chosen here.
      - name: Supply-chain policy evaluation (REPORT_ONLY while policy/supply-chain.yaml is UNDECIDED)
        shell: bash
        run: |
          python scripts/supply_chain.py evaluate --policy policy/supply-chain.yaml --licenses licenses.json --pip-audit pip-audit.json --npm-audit frontend/npm-audit.json --bandit bandit.json -o supply-chain-evaluation.json | tee -a "$GITHUB_STEP_SUMMARY"
