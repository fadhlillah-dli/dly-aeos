# DLY AEOS CI — pipeline gates G1 (static) and G2/G3 (controlled/product tests) from master §31.
# PR builds get no secrets; actions are pinned to full commit SHAs (supply-chain policy).
# This workflow is a protected path: workers may only propose changes to it (§09, AGENTS.md).
#
# Gate mapping is explicit: every job name carries its gates in brackets ([G1,G2], [G3]) or [NO-GATE]
# for report-only jobs; aeos.delivery.provider.classify_check reads the tag (ADR-0095).
#
# Runner budget: the repository is public on GitHub Free (owner decision 2026-10-25, ADR-0115), where
# standard GitHub-hosted runners cost nothing. Pull requests and pushes to main therefore run the full
# suite and the bootstrap on the owner's host platforms: Windows, macOS on Apple Silicon (macos-latest,
# arm64) and macOS on Intel (macos-26-intel, x86_64) (master §06/§07). Linux is not a host platform for
# now (owner decision 2026-10-26, ADR-0115 amendment), so no backend/bootstrap job runs on Linux. The UI,
# browser and supply-chain jobs stay on ubuntu-latest runners because they check platform-neutral
# artifacts (the frontend bundle, lockfiles) and are fastest there; they do not claim Linux host support.
# Use standard runner labels only: larger runners are billed even for public repositories.
#
# Backend layout (ADR-0115 amendments "CI in about ten minutes" and "rebalanced shards"): on every host OS the full
# backend suite is split by test file (tests/conftest.py --shard K/N, weights in tests/ci_durations.json) and each
# shard runs with one pytest-xdist worker per logical CPU: 3 shards on windows-latest (Windows jobs do not use the
# macOS slots), 2 on each macOS. Together the shards of an OS run every test of the old single job, and every shard
# job is the same (install, pytest, JUnit upload). The G1 static checks (ruff, mypy for darwin and win32, the secret
# scan) run once, in their own job on ubuntu-latest, so no shard carries extra work and the split can be even. The
# real trusted-suite verifier run has its own job on macos-latest. The required check names of the main ruleset,
# "backend [G1,G2] (<os>)", are aggregator jobs on ubuntu-latest that need the static job and every backend job of
# their OS and pass only when each of them ended in success (skipped or cancelled is never a pass). Each shard uploads
# its JUnit XML (rebalance input for scripts/ci_durations.py). Every job sets timeout-minutes: the default is 360, and
# a hung macOS job would hold one of GitHub Free's 5 account-wide macOS slots for hours.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels that pull request's older run. A push to main never shares a group
# (one group per run), so a main run is never cancelled or replaced while pending: every merge commit gets its
# own CI result, which `aeos ops release accept` needs.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The G1 static checks run once for all host OSes (they are platform-neutral: ruff and the secret scan read files,
  # and mypy checks the darwin and win32 code paths with --platform, which needs no such host). Out of the shards, so
  # that every shard is the same job and the test split can be even. Every backend aggregator needs this job, so a
  # failing static check fails all three required "backend [G1,G2] (<os>)" names.
  static-checks:
    name: static checks [G1] (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install (universal lockfile, ADR-0093)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip check
      - name: G1 static — ruff
        run: python -m ruff check backend tests scripts
      - name: G1 static — mypy for the macOS and Windows code paths (every module, none exempt in pyproject.toml)
        run: |
          python -m mypy --platform darwin
          python -m mypy --platform win32
      - name: G1 static — secret + PII scan (blueprints, contracts, docs)
        run: python scripts/secret_scan.py

  backend-shards-windows-latest:
    name: backend shard ${{ matrix.shard }}/${{ matrix.shards }} [G2] (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, shard: 1, shards: 3 }
          - { os: windows-latest, shard: 2, shards: 3 }
          - { os: windows-latest, shard: 3, shards: 3 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install (universal lockfile, ADR-0093)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip check
      # -n logical: one worker per logical CPU. "-n auto" counts physical cores (psutil is installed), which is
      # half the vCPUs on the 4-vCPU Windows runner.
      - name: G2 controlled tests (shard ${{ matrix.shard }} of ${{ matrix.shards }}, parallel workers)
        run: python -m pytest -q -m "not integration and not network" -n logical --shard ${{ matrix.shard }}/${{ matrix.shards }} --junitxml=junit-backend.xml
      - name: Upload the shard's JUnit XML (input for scripts/ci_durations.py)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-backend-${{ matrix.os }}-shard-${{ matrix.shard }}
          path: junit-backend.xml
          if-no-files-found: warn
          retention-days: 14

  backend-shards-macos-latest:
    name: backend shard ${{ matrix.shard }}/${{ matrix.shards }} [G2] (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, shard: 1, shards: 2 }
          - { os: macos-latest, shard: 2, shards: 2 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install (universal lockfile, ADR-0093)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip check
      # -n logical: one worker per logical CPU. "-n auto" counts physical cores (psutil is installed), which is
      # half the vCPUs on the 4-vCPU Windows runner.
      - name: G2 controlled tests (shard ${{ matrix.shard }} of ${{ matrix.shards }}, parallel workers)
        run: python -m pytest -q -m "not integration and not network" -n logical --shard ${{ matrix.shard }}/${{ matrix.shards }} --junitxml=junit-backend.xml
      - name: Upload the shard's JUnit XML (input for scripts/ci_durations.py)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-backend-${{ matrix.os }}-shard-${{ matrix.shard }}
          path: junit-backend.xml
          if-no-files-found: warn
          retention-days: 14

  backend-shards-macos-26-intel:
    name: backend shard ${{ matrix.shard }}/${{ matrix.shards }} [G2] (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-26-intel, shard: 1, shards: 2 }
          - { os: macos-26-intel, shard: 2, shards: 2 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install (universal lockfile, ADR-0093)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip check
      # -n logical: one worker per logical CPU. "-n auto" counts physical cores (psutil is installed), which is
      # half the vCPUs on the 4-vCPU Windows runner.
      - name: G2 controlled tests (shard ${{ matrix.shard }} of ${{ matrix.shards }}, parallel workers)
        run: python -m pytest -q -m "not integration and not network" -n logical --shard ${{ matrix.shard }}/${{ matrix.shards }} --junitxml=junit-backend.xml
      - name: Upload the shard's JUnit XML (input for scripts/ci_durations.py)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-backend-${{ matrix.os }}-shard-${{ matrix.shard }}
          path: junit-backend.xml
          if-no-files-found: warn
          retention-days: 14

  # Moved out of the macos-latest backend job so that it runs next to the shards instead of after the suite.
  backend-verifier-macos-latest:
    name: backend verifier [G2] (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install (universal lockfile, ADR-0093)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip check
      - name: G2 verifier runs the trusted suite for real (git only)
        run: python -m pytest -q -m integration tests/integration/test_verification_real_suite.py

  # Required check names (main ruleset): one aggregator per host OS. `if: always()` makes it report even when a
  # needed job failed or was skipped or cancelled; it then fails. It passes only when every needed job succeeded.
  backend-windows-latest:
    name: backend [G1,G2] (windows-latest)
    if: always()
    needs: [static-checks, backend-shards-windows-latest]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: The static checks and every backend job of windows-latest succeeded (skipped, cancelled or failed is never a pass)
        shell: bash
        env:
          RESULTS: >-
            static-checks=${{ needs.static-checks.result }}
            backend-shards-windows-latest=${{ needs.backend-shards-windows-latest.result }}
        run: |
          status=0
          count=0
          for entry in $RESULTS; do
            count=$((count + 1))
            if [ "${entry#*=}" = "success" ]; then echo "PASS  ${entry}"; else echo "FAIL  ${entry} (only success passes)"; status=1; fi
          done
          if [ "$count" -eq 0 ]; then echo "FAIL  no needed job result"; status=1; fi
          exit "$status"

  backend-macos-latest:
    name: backend [G1,G2] (macos-latest)
    if: always()
    needs: [static-checks, backend-shards-macos-latest, backend-verifier-macos-latest]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: The static checks and every backend job of macos-latest succeeded (skipped, cancelled or failed is never a pass)
        shell: bash
        env:
          RESULTS: >-
            static-checks=${{ needs.static-checks.result }}
            backend-shards-macos-latest=${{ needs.backend-shards-macos-latest.result }}
            backend-verifier-macos-latest=${{ needs.backend-verifier-macos-latest.result }}
        run: |
          status=0
          count=0
          for entry in $RESULTS; do
            count=$((count + 1))
            if [ "${entry#*=}" = "success" ]; then echo "PASS  ${entry}"; else echo "FAIL  ${entry} (only success passes)"; status=1; fi
          done
          if [ "$count" -eq 0 ]; then echo "FAIL  no needed job result"; status=1; fi
          exit "$status"

  backend-macos-26-intel:
    name: backend [G1,G2] (macos-26-intel)
    if: always()
    needs: [static-checks, backend-shards-macos-26-intel]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: The static checks and every backend job of macos-26-intel succeeded (skipped, cancelled or failed is never a pass)
        shell: bash
        env:
          RESULTS: >-
            static-checks=${{ needs.static-checks.result }}
            backend-shards-macos-26-intel=${{ needs.backend-shards-macos-26-intel.result }}
        run: |
          status=0
          count=0
          for entry in $RESULTS; do
            count=$((count + 1))
            if [ "${entry#*=}" = "success" ]; then echo "PASS  ${entry}"; else echo "FAIL  ${entry} (only success passes)"; status=1; fi
          done
          if [ "$count" -eq 0 ]; then echo "FAIL  no needed job result"; status=1; fi
          exit "$status"

  frontend:
    name: frontend [G1,G3]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: G1 static — typecheck
        run: npx tsc -b --noEmit
      - name: G3 product tests — unit/component
        run: npm test
      - name: Build
        run: npm run build

  browser-e2e:
    name: browser e2e + a11y smoke [G3]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Stdlib only, so it runs before the install: fragments in changelog.d/ and the CHANGELOG.md structure.
      - name: Changelog fragments and CHANGELOG.md structure
        run: python scripts/changelog.py --check
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Playwright version (browser cache key)
        id: playwright
        shell: bash
        run: echo "version=$(python -c 'from importlib.metadata import version; print(version("playwright"))')" >> "$GITHUB_OUTPUT"
      # Browser binaries only (public downloads, nothing secret), keyed by the pinned Playwright version.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - name: Playwright Chromium and its OS packages (a cached browser is not downloaded again)
        run: python -m playwright install --with-deps chromium
      - name: Build the Control Center
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: G3 real-browser smoke (every nav route, 390px overflow, dark-mode contrast, labels)
        run: python -m pytest -q -m integration tests/e2e/test_ui_smoke.py
      # Baseline numbers only (REPORT_ONLY): no latency objective is decided (§33); the test fails only on a
      # pathological sanity ceiling, never on the numbers themselves.
      - name: G3 performance baseline (report-only p50/p95 of key read endpoints)
        # shell: bash = bash -eo pipefail: a failing command before `| tee` fails the step instead of being masked
        shell: bash
        env:
          DLY_AEOS_PERF_REPORT: perf-baseline.json
        run: |
          python -m pytest -q tests/unit/test_perf_baseline.py
          python -c "import json; d = json.load(open('perf-baseline.json')); [print(k, v) for k, v in d['endpoints'].items()]" | tee -a "$GITHUB_STEP_SUMMARY"

  bootstrap:
    name: bootstrap [G2] (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-26-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The caches hold downloaded packages only (the user-level pip and npm caches the bootstrap's own .venv pip and
      # npm ci read); the bootstrap still installs everything from requirements.lock and package-lock.json.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Bootstrap (macOS)
        if: runner.os != 'Windows'
        env:
          AEOS_DATA_DIR: ${{ runner.temp }}/aeos-bootstrap-data
        run: ./scripts/bootstrap.sh --no-doctor
      - name: Bootstrap (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          AEOS_DATA_DIR: ${{ runner.temp }}/aeos-bootstrap-data
        run: .\scripts\bootstrap.ps1 -NoDoctor
      - name: Database at head, UI built, nothing written to the source tree
        shell: bash
        env:
          AEOS_DATA_DIR: ${{ runner.temp }}/aeos-bootstrap-data
        run: |
          test -f "$AEOS_DATA_DIR/aeos.sqlite3"
          test -f frontend/dist/index.html
          if [ "$RUNNER_OS" = "Windows" ]; then PY=.venv/Scripts/python; else PY=.venv/bin/python; fi
          "$PY" -c "from aeos.core.migrate import migration_status as m; s = m(); print(s); assert s['current'] == s['head'], s"
          git status --porcelain
          test -z "$(git status --porcelain)"
      - name: Negative case — bootstrap must fail when the database step fails (invalid data dir)
        shell: bash
        env:
          AEOS_DATA_DIR: relative-data-dir
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            if pwsh -File scripts/bootstrap.ps1 -NoDoctor -SkipFrontend -SkipBackup; then echo "bootstrap did not fail"; exit 1; fi
          else
            if ./scripts/bootstrap.sh --no-doctor --skip-frontend --skip-backup; then echo "bootstrap did not fail"; exit 1; fi
          fi
          test ! -e relative-data-dir

  # Commit messages of the pull request's own commits (scripts/commit_subject.py): the Conventional Commits subject
  # format and no AI attribution in the message, author or committer (backend/aeos/core/attribution.py). Needs the
  # full history (fetch-depth: 0 here only) to walk base..head and to find the baseline below which nothing is
  # checked. Stdlib only (the script puts backend/ on sys.path itself), so there is no Python setup step. Not run for pushes to main: those arrive through merged pull requests.
  # The same cheap ubuntu job also lints the shell scripts (second step).
  commit-subjects:
    name: commit subjects [G1]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: G1 static — commit messages (Conventional Commits subject, no attribution; merge commits only the latter)
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/commit_subject.py "$BASE_SHA..$HEAD_SHA"
      # shellcheck is preinstalled on ubuntu-latest. The shell scripts are the macOS bootstrap and dev helpers, the
      # local test runner and the pre-push hook; a quoting slip in them fails here instead of on the owner's machine.
      - name: G1 static — shellcheck (scripts/*.sh and the pre-push hook)
        run: shellcheck scripts/*.sh scripts/git-hooks/pre-push

  supply-chain:
    name: supply-chain report [NO-GATE] (SBOM, licences, vulnerabilities, SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      # Reports go to the job log and the step summary (no extra third-party action). Results are data for
      # the owner, never a pass claim: this job is [NO-GATE] until thresholds/allow-lists are decided in
      # policy/supply-chain.yaml (owner decision; status UNDECIDED = REPORT_ONLY).
      # Every step runs under `shell: bash` (bash --noprofile --norc -eo pipefail): a crashed tool before
      # `| tee` fails its step instead of looking like success. The scanner steps stay continue-on-error (a
      # finding or a crash is visible as a failed step, not a failed job); the policy evaluation below
      # treats a missing/unreadable report as such - never as "no findings".
      - name: SBOM (CycloneDX, offline, from the lockfiles)
        shell: bash
        run: |
          python scripts/supply_chain.py sbom -o sbom.cdx.json
          python -c "import json; d = json.load(open('sbom.cdx.json')); print('SBOM components:', len(d['components']))" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Licence report (REPORT_ONLY until the owner decides an allow-list)
        shell: bash
        run: |
          python scripts/supply_chain.py licenses --policy policy/supply-chain.yaml -o licenses.json
          python -c "import json; d = json.load(open('licenses.json')); print('Licences:', d['count'], 'packages,', len(d['unknown']), 'UNKNOWN:', d['unknown'], 'status:', d['status'])" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Python dependency vulnerabilities (report-only, NOT-PROVEN until thresholds are decided)
        continue-on-error: true
        shell: bash
        run: |
          python -m pip install "pip-audit==2.7.3"
          python -m pip_audit -r requirements.lock --no-deps --disable-pip -f json -o pip-audit.json
      - name: npm dependency vulnerabilities (report-only)
        continue-on-error: true
        shell: bash
        working-directory: frontend
        run: npm audit --omit=dev --json > npm-audit.json
      - name: SAST — bandit (report-only)
        continue-on-error: true
        shell: bash
        run: |
          python -m pip install "bandit==1.7.10"
          python -m bandit -q -r backend/aeos -f json -o bandit.json
      # Severity filtering is the owner's threshold (policy file), never a tool flag chosen here.
      - name: Supply-chain policy evaluation (REPORT_ONLY while policy/supply-chain.yaml is UNDECIDED)
        shell: bash
        run: |
          python scripts/supply_chain.py evaluate --policy policy/supply-chain.yaml --licenses licenses.json --pip-audit pip-audit.json --npm-audit frontend/npm-audit.json --bandit bandit.json -o supply-chain-evaluation.json | tee -a "$GITHUB_STEP_SUMMARY"
