# Pipeline reference template (master §31 "pipeline reference per project, implemented with the
# domain-appropriate CI"). Generic: contains no project data.
#
# DLY AEOS computes gates G1/G2/G3/G5 from provider CI check-runs of the exact commit. Without a pipeline
# reference the CI jobs are classified by name heuristics (aeos.delivery.provider.GATE_HINTS) and the CI
# evidence records `gate_mapping: NAME_HEURISTIC`. With a reference the mapping is explicit
# (`gate_mapping: PIPELINE_REFERENCE`): a job counts for a gate only when its exact check-run name is listed.
#
# Where it lives: the project's CI integration in the Integration Registry (PUT /api/projects/<id>/integrations)
#   provider: github-actions (PERSONAL)      | bitbucket-pipelines (OFFICE, ADR-0111)
#   purpose:  ci
#   config:   one scalar entry per gate, comma-separated exact CI job names:
#             GitHub: check-run names. Bitbucket: Pipelines step names (`- step: name: ...`) or the `name` of a
#             commit status reported by another company-approved CI.
domain_ci:
  PERSONAL: github-actions
  OFFICE: bitbucket-pipelines   # read only while the OFFICE adapter is AVAILABLE (company authorisation, Cloud only)
config_example:
  gate_G1: "lint, typecheck, secret-scan"          # static checks
  gate_G2: "backend (ubuntu-latest), backend (windows-latest)"   # controlled tests in CI (the verifier is G2's trusted source)
  gate_G3: "frontend, e2e"                         # product / browser tests
  gate_G5: "backend (ubuntu-latest)"               # retest on the merge commit
rules:
  - "Gates G0, G4, G6, G7, G8 never come from CI job names (plan binding, review, staging target, human merge, post-release)."
  - "A gate whose jobs are missing on the commit is NOT_PROVEN, never PASS."
  - "Changing the reference is a configuration change: earlier CI evidence keeps the mapping it was recorded with."
