# Example non-secret configuration. Copy to the OS config dir as aeos.yaml, or point AEOS_CONFIG at
# a file. Secrets (API keys, tokens, passwords) are REJECTED here — use `aeos secrets set ...`.
#   Windows: %LOCALAPPDATA%\DLY-AEOS\aeos.yaml
#   macOS:   ~/Library/Application Support/DLY-AEOS/aeos.yaml
environment: local
host: 127.0.0.1          # loopback only (master §06)
port: 8787
# data_dir: overrides the OS default data directory
session_ttl_hours: 12
session_idle_minutes: 120
max_upload_bytes: 26214400
openbao_addr: http://127.0.0.1:8200
# OpenRouter :free model limits (owner decision C, ADR-0041 amendment 2026-10-26). Per OpenRouter account and shared by
# every :free model: 20 requests/minute; 50 requests per UTC day, or 1000 once at least 10 credits were purchased (all
# time). Raise the daily cap only after that purchase; a value above the documented limit is refused at startup.
# openrouter_free_rpm_limit: 20
# openrouter_free_daily_limit: 50
# Canonical MCI_V2 source (owner-supplied, never committed: the platform repository is public). Default:
# <data dir>/policy/canonical/<file> named by policy/mci-reference.yaml "location: local:<file>". An absolute
# path here overrides it; a path inside the repository is refused.
# mci_source_path: /absolute/path/outside/the/repo/MCI_V2_SOURCE_OF_TRUTH.md
# claude_binary: /path/to/claude          # default: found on PATH
# opencode_binary: /path/to/opencode      # default: found on PATH
platform_repo_slug: fadhlillah-dli/dly-aeos
# Commit identity per code host (master s06 + owner rule, AGENTS.md invariant 11). Every commit DLY AEOS pushes is
# authored AND committed by this identity of the code host: github = your GitHub identity (e.g. the noreply
# address), bitbucket = your company identity (a different address). No AI or bot identity is accepted. Keep the
# real addresses only in your local aeos.yaml - never commit them. Unset for a host -> candidates are committed
# locally as "AEOS Runtime <aeos-runtime@localhost>", marked not pushable, and the broker refuses the push.
# Owner step: replace BOTH placeholders below in your local copy (a name or address left as <...> is refused, so an
# unedited copy is never CONFIGURED), then run `aeos doctor`: git.commit_identity.github and
# git.commit_identity.bitbucket must show CONFIGURED. Until the github identity is CONFIGURED, CAN_PREPARE_PR is
# BLOCKED (docs/OPERATIONS.md "Commit identity and no AI attribution").
# commit_identities:
#   github:
#     name: <Your Name>
#     email: <id>+<username>@users.noreply.github.com   # your GitHub identity (noreply address recommended)
#   bitbucket:
#     name: <Your Name>
#     email: <you>@<company-domain>                     # your company identity (a different address)
# Backward-compatible fallback for the github identity only (commit_identities.github wins when both are set):
# commit_author_name: <Your Name>
# commit_author_email: <id>+<username>@users.noreply.github.com
