# Example non-secret configuration. Copy to the OS config dir as aeos.yaml, or point AEOS_CONFIG at
# a file. Secrets (API keys, tokens, passwords) are REJECTED here — use `aeos secrets set ...`.
#   Windows: %LOCALAPPDATA%\DLY-AEOS\aeos.yaml
#   macOS:   ~/Library/Application Support/DLY-AEOS/aeos.yaml
environment: local
host: 127.0.0.1          # loopback only (master §06)
port: 8787
# data_dir: overrides the OS default data directory
session_ttl_hours: 12
session_idle_minutes: 120
max_upload_bytes: 26214400
openbao_addr: http://127.0.0.1:8200
# Canonical MCI_V2 source (owner-supplied, never committed: the platform repository is public). Default:
# <data dir>/policy/canonical/<file> named by policy/mci-reference.yaml "location: local:<file>". An absolute
# path here overrides it; a path inside the repository is refused.
# mci_source_path: /absolute/path/outside/the/repo/MCI_V2_SOURCE_OF_TRUTH.md
# claude_binary: /path/to/claude          # default: found on PATH
# opencode_binary: /path/to/opencode      # default: found on PATH
platform_repo_slug: fadhlillah-dli/dly-aeos
# Attribution of worker candidate commits (master s06): the owner's own identity, e.g. the GitHub noreply
# address. Unset -> "AEOS Runtime <aeos-runtime@localhost>", reported as not linked to an account.
# commit_author_name: Your Name
# commit_author_email: 12345+user@users.noreply.github.com
