# Near-miss for bad-workflow.yml: the same workflow with the matrix key spelled correctly. actionlint must accept it.
name: near miss fixture
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
      - run: echo "${{ matrix.os }}"
