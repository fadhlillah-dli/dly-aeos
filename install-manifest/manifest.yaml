# DLY AEOS InstallManifest (master §07, §13, §37, §45). Protected path (§09): workers may only
# propose changes here; a human reviews every edit.
#
# This file is the DESIGN lens of the inventory: what the reviewed design selects, plans or keeps
# as a candidate/reference. It is NOT installation, connection, evaluation or usage evidence.
# Loading it (aeos seed) never sets installed/enabled/verified/in-use state; those dimensions come
# from dated observations and human decisions (§38).
#
# Rules enforced by aeos.inventory.manifest (schema.json + semantic checks):
#   * source_url is either a URL that appears verbatim in the master document, or null;
#   * identity_verified is VERIFIED only when the master gives the canonical URL, else UNVERIFIED;
#   * license stays null unless the master states it (it never does) - never guessed;
#   * approved_pin null means UNKNOWN; "latest" is never a pin;
#   * UNVERIFIED components carry no install operation;
#   * health probes target loopback only; probes are read-only and time-bounded.
manifest_version: "1"
status: DESIGN
title: DLY AEOS InstallManifest
master_ref: docs/architecture/DLY_AEOS_Master_Architecture_Final.md
sources_checked: "2026-10-17/2026-10-18"
reviewed_by: null
categories:
  - experience/intake
  - planning/governance
  - workforce
  - tools/context
  - code/docs/CI
  - data/secrets
  - operations/evaluation
components:
