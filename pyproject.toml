[build-system]
# PEP 639 licence expression + license-files need setuptools 77.0.3 or newer (bdist_wheel is built in).
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "dly-aeos"
version = "0.1.0"
description = "DLY AI Engineering Operating System - local-first control plane"
readme = "README.md"
requires-python = ">=3.11"
# All rights reserved (see LICENSE). PEP 639: an SPDX LicenseRef expression, no licence classifiers.
license = "LicenseRef-DLY-AEOS-Proprietary"
license-files = ["LICENSE"]
authors = [{ name = "Fadhlillah" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "httpx>=0.27",
  "argon2-cffi>=23.1",
  "keyring>=25",
  "platformdirs>=4.2",
  "python-multipart>=0.0.9",
  "pyyaml>=6",
  "typer>=0.12",
  "rich>=13",
  "psutil>=6",
  "python-docx>=1.1",
  "google-auth>=2.30",
  "google-auth-oauthlib>=1.2",
  "jsonschema>=4.22",
  "filetype>=1.2",
  "anyio>=4",
  "pypdf>=5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  # Parallel test run (pytest -n auto). CI splits the suite into shards (tests/conftest.py --shard K/N) and
  # runs each shard on parallel workers, -n logical (ADR-0115 amendment "CI in about ten minutes").
  "pytest-xdist>=3.8",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "types-psutil",
  # Real-browser UI smoke test (tests/e2e, marked integration); also run: python -m playwright install chromium
  "playwright>=1.40",
]

[project.scripts]
aeos = "aeos.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
aeos = ["**/*.yaml", "**/*.json", "**/*.md", "**/*.ini", "**/*.mako", "static/**/*"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: needs local tools (claude, opencode, openbao, docker); skipped when absent",
  "acceptance: trusted acceptance suite (read-only for workers)",
  "network: needs internet access",
]
filterwarnings = ["ignore::DeprecationWarning:google.*"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["E501", "SIM105", "SIM108", "S101", "S603", "S607", "B008", "RUF012", "S105", "S106"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "RUF"]

[tool.mypy]
python_version = "3.11"
mypy_path = "backend"
packages = ["aeos"]
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true

# Type checking is a real gate (master §11 "type checking", CI step "G1 static - mypy"): every module
# type-checks cleanly on both host platforms (--platform darwin and win32). The ratcheted baseline of
# 2026-10-19 (230 errors in 33 modules, exempt via ignore_errors) was burned down to zero: 33 -> 13 (K4,
# 2026-10-19), 13 -> 0 (W6-040, 2026-10-26). Never add an ignore_errors override (tests/unit/test_ci_gates.py
# enforces it); a narrowly scoped "# type: ignore[code]" needs a reason and a genuine third-party typing gap.
