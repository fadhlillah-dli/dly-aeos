[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dly-aeos"
version = "0.1.0"
description = "DLY AI Engineering Operating System - local-first control plane"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Fadhlillah" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "httpx>=0.27",
  "argon2-cffi>=23.1",
  "keyring>=25",
  "platformdirs>=4.2",
  "python-multipart>=0.0.9",
  "pyyaml>=6",
  "typer>=0.12",
  "rich>=13",
  "psutil>=6",
  "python-docx>=1.1",
  "google-auth>=2.30",
  "google-auth-oauthlib>=1.2",
  "jsonschema>=4.22",
  "filetype>=1.2",
  "anyio>=4",
  "pypdf>=5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "types-psutil",
  # Real-browser UI smoke test (tests/e2e, marked integration); also run: python -m playwright install chromium
  "playwright>=1.40",
]

[project.scripts]
aeos = "aeos.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
aeos = ["**/*.yaml", "**/*.json", "**/*.md", "**/*.ini", "**/*.mako", "static/**/*"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: needs local tools (claude, opencode, openbao, docker); skipped when absent",
  "acceptance: trusted acceptance suite (read-only for workers)",
  "network: needs internet access",
]
filterwarnings = ["ignore::DeprecationWarning:google.*"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["E501", "SIM105", "SIM108", "S101", "S603", "S607", "B008", "RUF012", "S105", "S106"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "RUF"]

[tool.mypy]
python_version = "3.11"
mypy_path = "backend"
packages = ["aeos"]
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true

# Ratcheted type-check baseline (master §11 "type checking", CI step "G1 static - mypy"): these
# modules had errors when the gate was introduced (2026-10-19, 230 errors in 33 files) and are
# exempt until fixed. Every other module - including every NEW module - must type-check cleanly.
# Remove an entry once its module is clean; never add one (tests/unit/test_ci_gates.py enforces it).
# 2026-10-19 (K4): docs_engine.renderer, doctor.* and inventory.* were fixed and removed (33 -> 22), then
# policy.decisions/router/snapshot, publisher.targets, routing.catalog/service, worker_runtime.processes and
# workforce.demo/loop (22 -> 13).
[[tool.mypy.overrides]]
module = [
  "aeos.broker.git_broker", "aeos.broker.grants", "aeos.broker.model_proxy",
  "aeos.cost.service",
  "aeos.delivery.pr_bundle",
  "aeos.planning.dag",
  "aeos.policy.queue",
  "aeos.proposals.review",
  "aeos.publisher.jobs",
  "aeos.worker_runtime.executor", "aeos.worker_runtime.opencode",
  "aeos.worker_runtime.sandbox",
  "aeos.workforce.scheduler",
]
ignore_errors = true
