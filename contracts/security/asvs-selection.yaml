not_selected:
  - ids: [V1.7.2]
    reason: local-first single host; no remote log sink (any remote log transfer is an owner decision with its own selection)
  - ids: [V1.9.1, V1.9.2]
    reason: all control-plane components talk over loopback on one host; TLS between them is out of profile (§06)
  - ids: [V2.2.2, V2.2.3, V2.5.5]
    reason: no SMS/e-mail authenticators or notification channel exist; the single local owner sees changes in the audit trail
  - ids: [V2.2.4, V2.2.5, V2.2.6, V2.2.7, V2.3.2, V2.3.3, V2.5.7]
    reason: no multi-factor/cryptographic authenticators in the local single-owner profile (owner decision for multi-user or remote access)
  - ids: [V2.4.3, V2.4.4]
    reason: passwords use argon2id (V2.4.1), not PBKDF2 or bcrypt
  - ids: [V2.6.1, V2.6.2, V2.6.3]
    reason: no look-up secrets (recovery codes) exist
  - ids: [V2.7.1, V2.7.2, V2.7.3, V2.7.4, V2.7.5, V2.7.6]
    reason: no out-of-band authenticator; single local owner on 127.0.0.1 (re-evaluate for any non-local deployment)
  - ids: [V2.8.1, V2.8.2, V2.8.3, V2.8.4, V2.8.5, V2.8.6, V2.8.7]
    reason: no one-time-password factor in the local profile (owner decision for multi-user or remote access)
  - ids: [V2.9.1, V2.9.2, V2.9.3]
    reason: no cryptographic (certificate/FIDO) verifier exists
  - ids: [V3.4.4]
    reason: the "__Host-" prefix requires a Secure cookie over HTTPS; the profile is plain HTTP on loopback (see V3.4.1, V9.1.1)
  - ids: [V3.5.1]
    reason: AEOS issues no OAuth tokens to linked applications; provider credentials are vault entries the owner deletes
  - ids: [V3.5.3]
    reason: only server-side sessions; no stateless (JWT) session tokens
  - ids: [V3.6.1, V3.6.2]
    reason: no federated identity provider / relying party
  - ids: [V4.3.1]
    reason: no multi-factor factor in the local single-owner profile; the admin interface is loopback-only (owner decision for remote access)
  - ids: [V5.2.1]
    reason: no WYSIWYG HTML editor accepts HTML input
  - ids: [V5.2.3]
    reason: AEOS sends no e-mail (no SMTP/IMAP)
  - ids: [V5.3.7]
    reason: no LDAP directory is queried
  - ids: [V5.3.10]
    reason: no XPath queries; XML is only parsed (XXE covered by V5.5.2)
  - ids: [V5.4.1, V5.4.2, V5.4.3]
    reason: AEOS is Python and TypeScript (managed memory); it ships no unmanaged code of its own
  - ids: [V5.5.1]
    reason: no native object serialization (pickle) crosses a trust boundary; data is exchanged as JSON
  - ids: [V6.1.2, V6.1.3]
    reason: the control plane processes no regulated health or financial records; a managed project that does needs its own selection
  - ids: [V6.2.1, V6.2.3, V6.2.4, V6.2.6, V6.2.7, V6.2.8]
    reason: AEOS implements no encryption itself - secrets are encrypted by OpenBao / the OS keyring (V6.4); it only hashes and MACs (V6.2.2, V6.2.5)
  - ids: [V6.3.3]
    reason: randomness comes from the operating system CSPRNG; AEOS keeps no entropy pool of its own
  - ids: [V8.1.1]
    reason: no load balancer or shared server-side cache in front of the local process
  - ids: [V8.3.3]
    reason: the only user is the owner; third-party personal data in OFFICE projects falls under the company authorisation (§23), not an AEOS consent flow
  - ids: [V8.3.6]
    reason: Python/JavaScript runtimes cannot reliably overwrite memory; not attempted
  - ids: [V9.1.1, V9.1.2, V9.1.3]
