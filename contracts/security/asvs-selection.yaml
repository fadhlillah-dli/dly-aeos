# OWASP ASVS control selection for DLY AEOS itself (master §46: "requirements selected per application/risk
# and version-pinned; evidence = a test and trace per relevant control").
#
# * Version pinned: ASVS 4.0.3. The complete 4.0.3 requirement catalog is contracts/security/asvs-4.0.3-catalog.yaml;
#   every non-deleted requirement of it appears here exactly once - under `selected` or under `not_selected` with
#   the reason (tests/unit/test_asvs_trace.py enforces that, chapter by chapter). Moving to ASVS 5.0.x renumbers the
#   chapters and is an owner decision (POLICY/ADR), not an automatic upgrade.
# * Risk profile (the application this selection is for): the AEOS control plane - local-first, single owner, bound
#   to 127.0.0.1 over plain HTTP (no TLS on loopback, §06), browser session cookie + CSRF + Origin/Host checks,
#   SQLite in the owner's data dir, secrets in OpenBao / the OS keyring, workers sandboxed behind a capability
#   broker, no e-mail/SMS/OTP/MFA, no SOAP/GraphQL. Controls outside that profile are under `not_selected` with the
#   reason; a non-loopback exposure, multi-user access or a remote deployment needs a new selection (owner decision).
# * Applications AEOS builds for other projects are NOT covered by this file: their ASVS level per data
#   classification/risk is an owner decision that is not recorded yet (UNDECIDED), so no per-project selection is
#   claimed.
# * Every selected control is `TESTED` with the pytest node ids that prove it (each id must exist) or `NOT_PROVEN`
#   with a note - a NOT_PROVEN control is never shown as met. TESTED means "the cited tests pass for the behaviour
#   named", not a certification.
